server:
  port: 8080

spring:
  application:
    name: careflow-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/careflow_ai}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:root123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

careflow:
  jwt:
    secret: ${JWT_SECRET:CareFlowAISecretKeyForJWTSigningMustBeAtLeast32BytesLong123456!}
    expirationMs: 86400000
  ai:
    groq:
      api-key: ${GROQ_API_KEY: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}
      model: ${GROQ_MODEL:qwen/qwen3.8-27b}
      url: https://api.groq.com/openai/v1/chat/completions

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
