server:
  port: ${PORT:9090}

spring:
  application:
    name: careflow-backend

  datasource:
    url: ${DB_URL:${SPRING_DATASOURCE_URL:jdbc:h2:file:${H2_DB_PATH:./data/careflow_ai};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}}
    username: ${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:sa}}
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}

  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  jackson:
    serialization:
      fail-on-empty-beans: false

  # Mail / SMTP Configuration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 8000
          timeout: 8000
          writetimeout: 8000

careflow:
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173,http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:CareFlowAISecretKeyForJWTSigningMustBeAtLeast32BytesLong123456!}
    expirationMs: 86400000

  ai:
    groq:
      api-key: ${GROQ_API_KEY:}
      model: ${GROQ_MODEL:qwen/qwen3.8-27b}
      url: https://api.groq.com/openai/v1/chat/completions

springdoc:
  api-docs:
    path: /api-docs

  swagger-ui:
    path: /swagger-ui.html

app:
  notifications:
    sender-email: ${MAIL_FROM:${spring.mail.username:noreply@careflow.ai}}
    forward-to: ${MAIL_FORWARD_TO:${spring.mail.username:}}
    enable-forwarding: ${MAIL_ENABLE_FORWARDING:true}
    resend-api-key: ${RESEND_API_KEY:}
    brevo-api-key: ${BREVO_API_KEY:}
    http-relay-url: ${MAIL_HTTP_RELAY_URL:}
    portal-url: ${PORTAL_URL:http://localhost:5173}
    follow-up-reminder-days: ${FOLLOW_UP_REMINDER_DAYS:1}
    follow-up-check-interval-ms: ${FOLLOW_UP_CHECK_INTERVAL_MS:3600000}
    follow-up-initial-delay-ms: ${FOLLOW_UP_INITIAL_DELAY_MS:20000}