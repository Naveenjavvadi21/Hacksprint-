server:
  port: 9090

spring:
  application:
    name: careflow-backend

  datasource:
    url: jdbc:h2:file:./data/careflow_ai;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  jackson:
    serialization:
      fail-on-empty-beans: false

careflow:
  jwt:
    secret: ${JWT_SECRET:CareFlowAISecretKeyForJWTSigningMustBeAtLeast32BytesLong123456!}
    expirationMs: 86400000

  ai:
    groq:
      api-key: ${GROQ_API_KEY:}
      model: ${GROQ_MODEL:qwen/qwen3.8-27b}
      url: https://api.groq.com/openai/v1/chat/completions

springdoc:
  api-docs:
    path: /api-docs

  swagger-ui:
    path: /swagger-ui.html